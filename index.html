<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Log Wise — Antrenmanını akıllıca kaydet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#0a0a0a;--bg2:#111;--bg3:#161616;--bg4:#1a1a1a;
  --t1:#e8e8e8;--t2:#888;--t3:#555;--t4:#333;
  --brd:#1f1f1f;--brd2:#2a2a2a;
  --gold:#f0c040;--gold2:#ffd060;--gold-d:#a8830c;
  --goldL:#2a2210;--goldL2:#3a3218;
  --green:#8fbc8f;--ngreen:#39ff14;--blue:#4dabf7;--purple:#d7aefb;
  --pink:#ff69b4;--orange:#ffa040;--coral:#ff7043;--teal:#78d9ec;
  --mono:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --display:'Space Grotesk','Inter',system-ui,sans-serif;
  --jet:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--t1);font-family:var(--mono);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img,svg{display:block}
.mono{font-family:var(--mono)}
.jet{font-family:var(--jet)}
.display{font-family:var(--display);letter-spacing:-.02em;line-height:.95}

/* =================== Layout =================== */
.shell{max-width:1280px;margin:0 auto;padding:0 32px}
section{position:relative}

/* =================== Nav =================== */
.nav{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--brd)}
.nav-row{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:36px;height:36px;border-radius:9px;background:#0a0a0a;border:1px solid var(--brd2);padding:5px;display:grid;place-items:center}
.brand-mark img{width:100%;height:100%}
.brand-name{font-family:var(--display);font-size:18px;letter-spacing:.04em}
.brand-name b{color:var(--gold)}
.nav-links{display:flex;gap:28px;font-size:13px;color:var(--t2)}
.nav-links a{transition:color .15s}
.nav-links a:hover{color:var(--t1)}
.nav-actions{display:flex;align-items:center;gap:10px}
.lang-switch{display:flex;border:1px solid var(--brd2);border-radius:8px;overflow:hidden;font-size:11px;letter-spacing:.1em}
.lang-switch button{padding:6px 10px;color:var(--t2);font-weight:700}
.lang-switch button.on{background:var(--gold);color:#000}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;letter-spacing:.04em;border:1px solid transparent;transition:transform .15s, background .15s, border-color .15s}
.btn-primary{background:var(--gold);color:#000}
.btn-primary:hover{background:var(--gold2)}
.btn-ghost{border-color:var(--brd2);color:var(--t1)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn:active{transform:translateY(1px)}

/* =================== Hero =================== */
.hero{padding:88px 0 96px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(800px 400px at 12% -10%, rgba(240,192,64,.10), transparent 60%),
  radial-gradient(600px 400px at 90% 0%, rgba(240,192,64,.06), transparent 60%);
  pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:center;position:relative}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--brd2);border-radius:99px;font-size:11px;letter-spacing:.18em;color:var(--t2);margin-bottom:24px}
.tag-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.hero h1{font-family:var(--display);font-size:84px;line-height:.92;letter-spacing:-.025em}
.hero h1 .gold{color:var(--gold)}
.hero h1 .strike{color:var(--t3);text-decoration:line-through;text-decoration-thickness:4px;text-decoration-color:#3a3a3a}
.hero p.lead{margin-top:22px;font-size:17px;color:var(--t2);max-width:520px;line-height:1.6}
.hero-ctas{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.hero-meta{display:flex;gap:28px;margin-top:36px;font-size:11px;color:var(--t3);letter-spacing:.16em}
.hero-meta b{color:var(--t1);font-weight:700}
.hero-meta .dot{width:4px;height:4px;background:var(--t4);border-radius:50%;align-self:center}

/* Hero mock (dashboard) */
.mock-stack{position:relative;height:560px}
.mock{position:absolute;background:var(--bg2);border:1px solid var(--brd2);border-radius:16px;box-shadow:0 32px 80px -20px rgba(0,0,0,.7), 0 8px 24px -8px rgba(0,0,0,.5)}
.mock.dash{top:0;right:0;width:100%;height:520px;overflow:hidden;transform:perspective(1500px) rotateY(-6deg) rotateX(2deg)}
.mock.card-pr{position:absolute;left:-48px;bottom:24px;width:280px;padding:18px;background:#141414;border:1px solid var(--brd2);transform:rotate(-3deg);z-index:3}
.mock.card-streak{position:absolute;right:-32px;top:32px;width:200px;padding:16px;transform:rotate(3deg);z-index:3;background:linear-gradient(160deg,#1a1408,#0e0a04);border-color:var(--goldL2)}

/* dashboard internals */
.dash-bar{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--brd);font-size:11px;color:var(--t2);letter-spacing:.14em}
.dash-bar .dot-r{width:9px;height:9px;border-radius:50%;background:#3a3a3a}
.dash-bar .dot-r.g{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.dash-tabs{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--brd);overflow-x:auto}
.dash-tab{padding:6px 12px;font-size:11px;color:var(--t2);border-radius:6px;letter-spacing:.1em;white-space:nowrap}
.dash-tab.on{background:var(--gold);color:#000;font-weight:700}
.dash-body{padding:18px}
.dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{padding:12px;border:1px solid var(--brd);border-radius:10px;background:var(--bg3)}
.stat-k{font-size:10px;color:var(--t3);letter-spacing:.14em}
.stat-v{font-family:var(--display);font-size:24px;color:var(--t1);margin-top:6px}
.stat-v.gold{color:var(--gold)}
.dash-chart{height:148px;border:1px solid var(--brd);border-radius:10px;background:var(--bg3);position:relative;overflow:hidden;margin-bottom:14px}
.chart-grid{position:absolute;inset:0;background-image:linear-gradient(var(--brd) 1px,transparent 1px);background-size:100% 24px;opacity:.6}
.chart-line{position:absolute;inset:0}
.chart-area{position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(180deg,rgba(240,192,64,.25),rgba(240,192,64,0))}
.chart-dots{position:absolute;inset:0}
.chart-dots span{position:absolute;width:7px;height:7px;background:var(--gold);border-radius:50%;border:2px solid #000;transform:translate(-50%,-50%);box-shadow:0 0 6px var(--gold)}
.dash-rows{display:flex;flex-direction:column;gap:8px}
.exrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--brd);border-radius:10px;background:var(--bg3)}
.exrow .pill{padding:3px 8px;font-size:9px;letter-spacing:.14em;border-radius:6px;color:#000;font-weight:700}
.pill.chest{background:#4dabf7}.pill.back{background:#39ff14}.pill.shoulder{background:#ffa040}.pill.legs{background:#78d9ec}.pill.bi{background:#d7aefb}.pill.tri{background:#ff69b4}
.exrow .name{flex:1;font-size:12px;color:var(--t1)}
.exrow .sets{font-size:10px;color:var(--t2);font-family:var(--jet)}
.exrow .pr{font-size:10px;color:var(--gold);font-weight:700;letter-spacing:.1em}

/* PR floating card */
.pr-card-h{font-size:10px;letter-spacing:.18em;color:var(--t3)}
.pr-card-v{font-family:var(--display);font-size:42px;color:var(--gold);margin-top:6px}
.pr-card-ex{font-size:11px;color:var(--t2);margin-top:4px}
.pr-card-bar{margin-top:14px;display:flex;gap:6px}
.pr-card-bar i{flex:1;height:4px;background:var(--brd);border-radius:2px}
.pr-card-bar i.on{background:var(--gold)}

/* Streak floating */
.streak-h{font-size:10px;letter-spacing:.18em;color:var(--gold-d)}
.streak-v{font-family:var(--display);font-size:48px;color:var(--gold);margin-top:6px;display:flex;align-items:baseline;gap:6px}
.streak-v small{font-size:14px;color:var(--gold-d);letter-spacing:.1em}
.streak-sub{font-size:11px;color:var(--t2);margin-top:2px}

/* =================== Marquee Strip =================== */
.strip{border-top:1px solid var(--brd);border-bottom:1px solid var(--brd);background:var(--bg2);overflow:hidden}
.strip-row{display:flex;gap:64px;padding:18px 0;animation:scroll 40s linear infinite;width:max-content;color:var(--t2);font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.strip-row span{display:inline-flex;align-items:center;gap:14px}
.strip-row b{color:var(--gold);font-family:var(--display);letter-spacing:.04em}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* =================== Section heading =================== */
.section-pad{padding:120px 0}
.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:48px;gap:32px;flex-wrap:wrap}
.section-kicker{font-size:11px;letter-spacing:.24em;color:var(--gold);margin-bottom:12px}
.section-title{font-family:var(--display);font-size:54px;line-height:1;letter-spacing:-.02em;max-width:680px}
.section-title .gold{color:var(--gold)}
.section-sub{color:var(--t2);max-width:420px;font-size:14px}

/* =================== Features =================== */
.feat-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.feat{border:1px solid var(--brd);border-radius:14px;padding:24px;background:var(--bg2);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-height:260px;transition:border-color .2s, transform .2s}
.feat:hover{border-color:var(--brd2);transform:translateY(-2px)}
.feat .ix{font-family:var(--jet);font-size:11px;color:var(--t3);letter-spacing:.14em;margin-bottom:24px}
.feat h3{font-family:var(--display);font-size:24px;line-height:1.05;letter-spacing:-.01em}
.feat p{margin-top:10px;color:var(--t2);font-size:13px}
.feat-art{margin-top:24px;height:100px;border-top:1px dashed var(--brd2);padding-top:18px;display:flex;align-items:center;gap:8px}
.feat.f-a{grid-column:span 5}
.feat.f-b{grid-column:span 4}
.feat.f-c{grid-column:span 3}
.feat.f-d{grid-column:span 4}
.feat.f-e{grid-column:span 4}
.feat.f-f{grid-column:span 4}

/* feature artwork */
.bars{display:flex;align-items:end;gap:6px;height:80px;width:100%}
.bars i{flex:1;background:var(--brd2);border-radius:3px}
.bars i.gold{background:var(--gold)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;width:100%}
.heat i{aspect-ratio:1;border-radius:2px;background:#181818}
.heat i.l1{background:rgba(240,192,64,.25)}.heat i.l2{background:rgba(240,192,64,.5)}.heat i.l3{background:rgba(240,192,64,.75)}.heat i.l4{background:var(--gold)}
.timer-display{font-family:var(--display);font-size:48px;color:var(--gold);letter-spacing:.04em}
.timer-sub{font-size:11px;color:var(--t3);letter-spacing:.18em;margin-top:4px}
.preset-list{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--t2);font-family:var(--jet)}
.preset-list span{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--brd)}
.preset-list span b{color:var(--t1)}
.lang-bubble{display:inline-flex;gap:6px;padding:6px 10px;border:1px solid var(--brd2);border-radius:8px;font-family:var(--jet);font-size:11px;color:var(--t1)}
.lang-bubble.on{background:var(--gold);color:#000;border-color:var(--gold)}
.muscle-rows{display:flex;flex-direction:column;gap:6px;width:100%}
.muscle-row{display:grid;grid-template-columns:60px 1fr 32px;align-items:center;gap:10px;font-size:10px;color:var(--t2);font-family:var(--jet)}
.muscle-row .bar{height:6px;background:var(--brd);border-radius:3px;overflow:hidden}
.muscle-row .bar i{display:block;height:100%;background:var(--gold)}
.muscle-row .bar i.alt{background:var(--blue)}
.muscle-row .bar i.alt2{background:var(--ngreen)}

/* =================== Programs =================== */
.programs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.prog{border:1px solid var(--brd);border-radius:14px;padding:24px;background:var(--bg2);display:flex;flex-direction:column;gap:18px;min-height:340px;position:relative;overflow:hidden;transition:border-color .2s}
.prog:hover{border-color:var(--gold)}
.prog .ix{font-family:var(--jet);font-size:10px;letter-spacing:.18em;color:var(--t3)}
.prog h3{font-family:var(--display);font-size:22px;line-height:1.05}
.prog .desc{font-size:12px;color:var(--t2)}
.prog .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:auto}
.prog .day{aspect-ratio:1;border:1px solid var(--brd);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:var(--t3);font-family:var(--jet);letter-spacing:.04em;gap:2px;position:relative}
.prog .day.on{background:var(--goldL);border-color:var(--gold);color:var(--gold)}
.prog .day.rest{color:var(--t4)}
.prog .day b{font-family:var(--display);font-size:11px;color:inherit}
.prog .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);font-family:var(--jet);letter-spacing:.08em;border-top:1px dashed var(--brd2);padding-top:12px;margin-top:auto}
.prog .meta b{color:var(--gold)}

/* =================== Charts strip =================== */
.charts-strip{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
.chart-card{border:1px solid var(--brd);border-radius:14px;background:var(--bg2);padding:24px;min-height:340px;display:flex;flex-direction:column}
.chart-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.chart-card-head h4{font-family:var(--display);font-size:18px}
.chart-card-head .sel{padding:6px 10px;border:1px solid var(--brd2);border-radius:8px;font-size:11px;color:var(--t2);font-family:var(--jet)}
.big-line{flex:1;position:relative;border-bottom:1px solid var(--brd);border-left:1px solid var(--brd);margin:8px 0 18px;min-height:200px}
.big-line::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--brd) 1px,transparent 1px),linear-gradient(90deg,var(--brd) 1px,transparent 1px);background-size:14% 25%;opacity:.5}
.big-line svg{position:absolute;inset:0;width:100%;height:100%}
.x-axis{display:flex;justify-content:space-between;font-size:9px;color:var(--t3);font-family:var(--jet);letter-spacing:.1em}
.legend{display:flex;gap:14px;margin-top:14px;font-size:10px;color:var(--t3);font-family:var(--jet);letter-spacing:.1em}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}

.rm-card{display:flex;flex-direction:column;justify-content:space-between}
.rm-num{font-family:var(--display);font-size:88px;color:var(--gold);line-height:.95;letter-spacing:-.02em}
.rm-num small{font-family:var(--display);font-size:24px;color:var(--gold-d);margin-left:8px}
.rm-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--brd2);font-size:12px;color:var(--t2);font-family:var(--jet)}
.rm-row b{color:var(--t1);font-family:var(--jet)}
.rm-row:last-child{border-bottom:0}

/* =================== Badges =================== */
.badges-band{padding:120px 0;background:radial-gradient(ellipse at center, rgba(240,192,64,.06), transparent 60%);border-top:1px solid var(--brd);border-bottom:1px solid var(--brd)}
.badges-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:12px}
.badge{aspect-ratio:1;border:1px solid var(--brd);border-radius:12px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:9px;color:var(--t3);text-align:center;padding:8px;letter-spacing:.06em;transition:transform .2s, border-color .2s}
.badge:hover{transform:translateY(-2px);border-color:var(--gold)}
.badge.locked{opacity:.35;filter:grayscale(1)}
.badge .ico{font-size:28px;line-height:1}
.badge .lbl{font-family:var(--jet);font-size:9px;letter-spacing:.04em;color:var(--t2)}
.badge.gold-on{background:linear-gradient(160deg,#1a1408,#0e0a04);border-color:var(--goldL2)}
.badge.gold-on .lbl{color:var(--gold)}

/* =================== Quote / split =================== */
.quote{padding:140px 0;text-align:center;border-bottom:1px solid var(--brd)}
.quote .q{font-family:var(--display);font-size:84px;line-height:.95;letter-spacing:-.025em;max-width:1100px;margin:0 auto}
.quote .q .gold{color:var(--gold)}
.quote .q .strike{color:var(--t3);text-decoration:line-through;text-decoration-thickness:5px;text-decoration-color:#2a2a2a}
.quote .by{margin-top:32px;font-size:11px;letter-spacing:.24em;color:var(--t3)}

/* =================== Final CTA =================== */
.cta{padding:140px 0;text-align:center;position:relative;overflow:hidden}
.cta::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 400px at center, rgba(240,192,64,.12), transparent 60%);pointer-events:none}
.cta-mark{width:88px;height:88px;border-radius:18px;background:#0a0a0a;border:1px solid var(--brd2);padding:10px;margin:0 auto 32px;position:relative;z-index:1}
.cta-mark img{width:100%;height:100%}
.cta h2{font-family:var(--display);font-size:104px;line-height:.92;letter-spacing:-.025em;position:relative;z-index:1}
.cta h2 .gold{color:var(--gold)}
.cta p{margin-top:24px;color:var(--t2);font-size:15px;position:relative;z-index:1}
.cta .ctas{display:flex;gap:12px;justify-content:center;margin-top:40px;flex-wrap:wrap;position:relative;z-index:1}

/* =================== Footer =================== */
footer{border-top:1px solid var(--brd);padding:48px 0 64px;color:var(--t3);font-size:12px}
.foot-row{display:flex;justify-content:space-between;align-items:flex-start;gap:48px;flex-wrap:wrap}
.foot-col{display:flex;flex-direction:column;gap:8px;min-width:140px}
.foot-col h5{font-family:var(--display);font-size:11px;color:var(--t1);letter-spacing:.16em;margin-bottom:6px}
.foot-col a{color:var(--t3);transition:color .15s}
.foot-col a:hover{color:var(--gold)}
.foot-bottom{margin-top:48px;padding-top:24px;border-top:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--t4);letter-spacing:.1em;flex-wrap:wrap;gap:12px}

/* =================== Responsive =================== */
@media (max-width: 1024px){
  .hero h1{font-size:64px}
  .hero-grid{grid-template-columns:1fr;gap:80px}
  .mock-stack{height:540px}
  .section-title{font-size:42px}
  .quote .q{font-size:56px}
  .cta h2{font-size:64px}
  .feat.f-a,.feat.f-b,.feat.f-c{grid-column:span 6}
  .feat.f-d,.feat.f-e,.feat.f-f{grid-column:span 6}
  .programs-grid{grid-template-columns:repeat(2,1fr)}
  .charts-strip{grid-template-columns:1fr}
  .badges-grid{grid-template-columns:repeat(6,1fr)}
}
@media (max-width: 640px){
  .shell{padding:0 20px}
  .nav-links{display:none}
  .hero{padding:56px 0 64px}
  .hero h1{font-size:48px}
  .feat-grid{grid-template-columns:1fr}
  .feat{grid-column:span 1!important}
  .programs-grid{grid-template-columns:1fr}
  .badges-grid{grid-template-columns:repeat(4,1fr)}
  .quote .q{font-size:36px}
  .cta h2{font-size:48px}
  .mock.card-pr{left:-12px;width:220px}

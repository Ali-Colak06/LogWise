const getAllPRs=(workouts,exercises)=>{const prs={};exercises.forEach(ex=>{let maxW=0,maxVol=0,max1RM=0;Object.values(workouts).forEach(dayW=>{const f=dayW.find(w=>w.exerciseId===ex.id);if(f)f.sets.forEach(s=>{if(s.weight>maxW)maxW=s.weight;const vol=s.weight*s.reps;if(vol>maxVol)maxVol=vol;const rm=calc1RM(s.weight,s.reps);if(rm>max1RM)max1RM=rm})});if(maxW>0)prs[ex.id]={maxWeight:maxW,maxVolume:maxVol,est1RM:Math.round(max1RM)}});return prs};
const calcCompliance=(pgId,workouts,programs,programMeta)=>{const meta=(programMeta||{})[pgId];if(!meta||!meta.activatedAt)return null;const pg=programs[pgId];if(!pg)return null;const start=pD(meta.activatedAt);const tod=new Date();tod.setHours(0,0,0,0);const daysDiff=Math.floor((tod-start)/(1000*60*60*24));if(daysDiff<0)return{week:1,rate:0,done:0,total:0,isDeload:false};const week=Math.floor(daysDiff/7)+1;let total=0,done=0;for(let i=0;i<=daysDiff;i++){const dd=new Date(start);dd.setDate(dd.getDate()+i);const di=gdow(dd);const pgExs=pg.days[String(di)]||[];if(pgExs.length===0)continue;total++;const dk=fmt(dd);const ws=workouts[dk]||[];if(pgExs.some(eid=>ws.some(w=>w.exerciseId===eid&&w.sets&&w.sets.length>0)))done++}const deloadEvery=meta.deloadEvery||0;const isDeload=deloadEvery>0&&week%deloadEvery===0;return{week,rate:total>0?Math.round(done/total*100):0,done,total,isDeload}};

const catLabel=(cat,lang)=>(lang==="en"?(CAT_LABELS_EN[cat]||cat):cat);
const normalizeUsername=v=>String(v||"").trim().toLowerCase();
const isValidUsername=v=>/^[a-z0-9_]{3,20}$/.test(v);
const defaultDisplayName=user=>user?.user_metadata?.full_name||user?.email?.split("@")[0]||"User";
const defaultAvatar=user=>user?.user_metadata?.avatar||"";
const buildProfileRow=(user,existing={},overrides={})=>{
  const metaUsername=normalizeUsername(user?.user_metadata?.username);
  const nextUsername=overrides.username!==undefined?normalizeUsername(overrides.username):(existing.username||(isValidUsername(metaUsername)?metaUsername:""));
  return{
    user_id:user.id,
    username:nextUsername||null,
    display_name:overrides.display_name??existing.display_name??defaultDisplayName(user),
    bio:overrides.bio??existing.bio??"",
    avatar:overrides.avatar??existing.avatar??defaultAvatar(user),
    is_public:overrides.is_public??existing.is_public??true
  };
};
const syncProfileRecord=async(user,overrides={})=>{
  if(!user?.id)return{data:null,error:new Error("Missing user")};
  const{data:existing,error:existingError}=await sb.from("profiles").select("*").eq("user_id",user.id).maybeSingle();
  if(existingError)return{data:null,error:existingError};
  const row=buildProfileRow(user,existing||{},overrides);
  if(existing){
    return await sb.from("profiles").update(row).eq("user_id",user.id).select("*").single();
  }
  return await sb.from("profiles").insert(row).select("*").single();
};

function DashChart({chartRef,chartInstanceRef,chartHist,mode,theme,L,lang}){
  useEffect(()=>{
    if(!chartRef.current||!chartHist.length)return;
    if(chartInstanceRef.current){chartInstanceRef.current.destroy();chartInstanceRef.current=null}
    const ctx=chartRef.current.getContext("2d");
    const labels=chartHist.map(h=>{const d=pD(h.date);return d.getDate()+"/"+(d.getMonth()+1)});
    const dataPoints=mode==="weight"?chartHist.map(h=>h.maxW):mode==="volume"?chartHist.map(h=>h.avgVolPerSet):chartHist.map(h=>h.best1RM);
    const label=mode==="weight"?L.dashWeight:mode==="volume"?L.dashVolPerSet:L.dashEst1RM;
    const borderColor=mode==="weight"?"#f0c040":mode==="volume"?"#8fbc8f":"#d7aefb";
    const bgColor=mode==="weight"?"rgba(240,192,64,0.1)":mode==="volume"?"rgba(143,188,143,0.1)":"rgba(215,174,251,0.1)";
    const gridColor=theme==="dark"?"rgba(255,255,255,0.06)":"rgba(0,0,0,0.06)";
    const tickColor=theme==="dark"?"#888":"#666";
    chartInstanceRef.current=new Chart(ctx,{
      type:"line",
      data:{labels,datasets:[{label:label+" (kg)",data:dataPoints,borderColor,backgroundColor:bgColor,borderWidth:2,pointRadius:3,pointHoverRadius:6,pointBackgroundColor:borderColor,tension:0.3,fill:true}]},
      options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:"index"},plugins:{legend:{display:false},tooltip:{backgroundColor:theme==="dark"?"#222":"#fff",titleColor:theme==="dark"?"#e0e0e0":"#1a1a1a",bodyColor:theme==="dark"?"#ccc":"#333",borderColor:theme==="dark"?"#333":"#ddd",borderWidth:1,cornerRadius:8,padding:10,displayColors:false,callbacks:{label:function(c){return label+": "+c.parsed.y+" kg"}}}},scales:{x:{grid:{color:gridColor},ticks:{color:tickColor,font:{size:10,family:"'Space Mono',monospace"},maxRotation:0,autoSkip:true,maxTicksLimit:8}},y:{grid:{color:gridColor},ticks:{color:tickColor,font:{size:10,family:"'Space Mono',monospace"}},beginAtZero:false}}}
    });
    return()=>{if(chartInstanceRef.current){chartInstanceRef.current.destroy();chartInstanceRef.current=null}};
  },[chartHist,mode,theme]);
  return <canvas ref={chartRef} style={{width:"100%",height:260}}/>;
}

function AuthScreen({onLogin,lang,setLang,onClose}){
const L=lang==="tr"?TR:EN;
const[mode,setMode]=useState("login"); // "login","register","forgot"
const[email,setEmail]=useState("");const[pw,setPw]=useState("");const[name,setName]=useState("");const[pw2,setPw2]=useState("");const[uname,setUname]=useState("");
const[err,setErr]=useState("");const[info,setInfo]=useState("");const[busy,setBusy]=useState(false);
const switchMode=(m)=>{setMode(m);setErr("");setInfo("")};
const sub=async e=>{
  e.preventDefault();setErr("");setInfo("");
  if(mode==="forgot"){
    if(!email){setErr(lang==="tr"?"E-posta adresini gir":"Enter your email");return;}
    setBusy(true);
    try{
      const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+profileRoute()+"?reset=1"});
      if(error){setErr(error.message);return;}
      setInfo(lang==="tr"?"Şifre sıfırlama linki e-postana gönderildi!":"Password reset link sent to your email!");
    }finally{setBusy(false)}
    return;
  }
  if(!email||!pw)return;
  if(mode==="register"&&(!name||pw!==pw2)){setErr(lang==="tr"?"Bilgileri kontrol edin":"Please check your info");return;}
  if(mode==="register"){
    if(!uname.trim()){setErr(L.usernameRequired);return;}
    if(!/^[a-zA-Z0-9_]{3,20}$/.test(uname.trim())){setErr(L.usernameInvalid);return;}
  }
  setBusy(true);
  try{
    if(mode==="login"){
      const{data,error}=await sb.auth.signInWithPassword({email,password:pw});
      if(error){setErr(lang==="tr"?"E-posta veya şifre hatalı":"Invalid email or password");return;}
      onLogin(data.user);
    }else{
      // Check username uniqueness before signup
      const uLower=normalizeUsername(uname);
      const{data:existing}=await sb.from("profiles").select("username").eq("username",uLower).maybeSingle();
      if(existing){setErr(L.usernameTaken);return;}
      const{data,error}=await sb.auth.signUp({email,password:pw,options:{data:{full_name:name,username:uLower}}});
      if(error){setErr(error.message);return;}
      // Best-effort profile bootstrap. If email confirmation delays the session,
      // the first authenticated visit will finish syncing the profile from auth metadata.
      if(data.user){
        const{error:profileError}=await syncProfileRecord(data.user,{username:uLower,display_name:name,is_public:true});
        if(profileError&&data.session){setErr(profileError.message);return;}
      }
      if(data.session){onLogin(data.user);}
      else{setInfo(lang==="tr"?"Kayıt başarılı! E-postanı onaylayıp giriş yap.":"Registered! Please confirm your email then log in.");setMode("login");}
    }
  }finally{setBusy(false)}
};
const googleLogin=async()=>{
  setBusy(true);
  try{
    const{error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:window.location.origin}});
    if(error)setErr(error.message);
  }finally{setBusy(false)}
};

// Swipe to change day
useEffect(()=>{
  if(!isMobile||view!=="day"||!selDate)return;
  const mainEl=document.querySelector('[role="main"]');
  if(!mainEl)return;
  const SWIPE_THRESHOLD=110;
  const MAX_VERTICAL_DRIFT=54;
  const onTouchStart=(e)=>{
    const interactive=e.target.closest?.("input, textarea, select, button, a");
    daySwipeRef.current={startX:e.touches[0].clientX,startY:e.touches[0].clientY,ignore:!!interactive};
  };
  const onTouchEnd=(e)=>{
    if(daySwipeRef.current.ignore)return;
    const endX=e.changedTouches[0].clientX;
    const endY=e.changedTouches[0].clientY;
    const diffX=daySwipeRef.current.startX-endX;
    const diffY=daySwipeRef.current.startY-endY;
    if(Math.abs(diffX)<SWIPE_THRESHOLD)return;
    if(Math.abs(diffY)>MAX_VERTICAL_DRIFT)return;
    if(Math.abs(diffX)<=Math.abs(diffY)*1.35)return;
    const nextDate=new Date(selDate);
    nextDate.setDate(nextDate.getDate()+(diffX>0?1:-1));
    setSelDate(nextDate);
    setCMonth(new Date(nextDate.getFullYear(),nextDate.getMonth(),1));
    setWOff(getWeekOffsetForDate(nextDate));
    if(dayNavFxTimeoutRef.current)clearTimeout(dayNavFxTimeoutRef.current);
    setDayNavFx({direction:diffX>0?"next":"prev",label:`${nextDate.getDate()} ${L.months[nextDate.getMonth()]}`,icon:diffX>0?"→":"←",token:Date.now()});
    dayNavFxTimeoutRef.current=setTimeout(()=>setDayNavFx(null),700);
  };
  mainEl.addEventListener("touchstart",onTouchStart,{passive:true});
  mainEl.addEventListener("touchend",onTouchEnd,{passive:true});
  return()=>{
    mainEl.removeEventListener("touchstart",onTouchStart);
    mainEl.removeEventListener("touchend",onTouchEnd);
  };
},[isMobile,view,selDate,lang]);

            {r.profile.username&&<span style={{fontSize:10,color:"var(--t3)"}}>@{r.profile.username}</span>}

        </div>
        <span style={{fontSize:14,fontWeight:600,textAlign:"right"}}>{r.max_weight}kg</span>

  </div>}

  {/* FEED */}
  {socialTab==="feed"&&<div>
    {feedLoading&&<div style={{textAlign:"center",padding:40,color:"var(--t3)"}}>⏳ ...</div>}

      <div style={{fontSize:48,marginBottom:12}}>📡</div>
      <p style={{fontSize:14,color:"var(--t2)",marginBottom:8}}>{L.noFeedData}</p>

      const exNames=typeof post.exercise_names==="string"?JSON.parse(post.exercise_names):(post.exercise_names||[]);

        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <div style={{width:36,height:36,borderRadius:"50%",background:"var(--blueL)",border:"2px solid var(--blue)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:post.profile.avatar?16:13,fontWeight:700,color:"var(--blue)",cursor:"pointer",flexShrink:0}} onClick={()=>window.location.href=profileRoute(post.user_id)}>

          <div style={{flex:1,minWidth:0}}>

            {post.profile.username&&<span style={{fontSize:11,color:"var(--t3)",marginLeft:4}}>@{post.profile.username}</span>}
            <span style={{fontSize:12,color:"var(--t3)",marginLeft:6}}>{L.feedShared}</span>
            <div style={{fontSize:11,color:"var(--t3)"}}>{new Date(post.created_at).toLocaleDateString(lang==="tr"?"tr-TR":"en-US",{day:"numeric",month:"short",year:"numeric"})}</div>
          </div>

        </div>}
      </div>);

  </div>}

  {/* USER SEARCH */}
  {socialTab==="search"&&<div>
    <div style={{background:"var(--bg2)",border:"1px solid var(--brd)",borderRadius:12,padding:16,marginBottom:16}}>
      <input value={userSearch} onChange={e=>{setUserSearch(e.target.value);if(e.target.value.length>=2)searchUsersFn(e.target.value);else setUserSearchResults([])}} placeholder={L.searchUsers} style={{...S.inp,marginBottom:0}} aria-label={L.searchUsers}/>
    </div>
    {searchLoading&&<div style={{textAlign:"center",padding:20,color:"var(--t3)"}}>⏳ ...</div>}
    {!searchLoading&&userSearch.length>=2&&userSearchResults.length===0&&<div style={{textAlign:"center",padding:32,color:"var(--t3)"}}>{L.noUsersFound}</div>}
    {userSearchResults.map(u=>{
      const isMe=!isGuest&&user&&u.user_id===user.id;
      const isFollowing=followingIds.includes(u.user_id);
      return(<div key={u.user_id} style={{background:"var(--bg2)",border:"1px solid var(--brd)",borderRadius:12,padding:14,marginBottom:8,display:"flex",alignItems:"center",gap:12}}>
        <div style={{width:44,height:44,borderRadius:"50%",background:"var(--blueL)",border:"2px solid var(--blue)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:u.avatar?20:16,fontWeight:700,color:"var(--blue)",flexShrink:0,cursor:"pointer"}} onClick={()=>window.location.href=profileRoute(u.user_id)}>

        <div style={{flex:1,minWidth:0}}>

          isFollowing

</div>}

{isMobile&&!isGuest&&<div style={{position:"fixed",bottom:0,left:0,right:0,height:56,borderTop:"1px solid var(--brd)",background:"var(--bg)",display:"flex",justifyContent:"space-around",alignItems:"center",zIndex:40,paddingBottom:"max(8px, env(safe-area-inset-bottom, 0px))"}}>

    <button key={v} onClick={()=>setView(v)} style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2,flex:1,height:"100%",border:"none",background:"transparent",cursor:"pointer",color:(view===v||activeTabMobile===v)?"var(--blue)":"var(--t2)",fontFamily:"inherit",fontSize:11,fontWeight:(view===v||activeTabMobile===v)?600:400,transition:"color .15s"}}>

<div aria-hidden="true" style={{height:isMobile?(isGuest?160:120):isGuest?PAGE_BOTTOM_GAP_GUEST:PAGE_BOTTOM_GAP,flexShrink:0}}/>
</main>
</div>

{/* HISTORY MODAL */}
{histId&&(()=>{
  const hist=getH(histId);const nm=exN(histId);const c=cl(histId);
  const isCardioHist=isCardioExerciseId(histId);
  let pr=0;let best1RM=0;hist.forEach(h=>h.sets.forEach(s=>{if(s.weight>pr)pr=s.weight;const rm=calc1RM(s.weight,s.reps);if(rm>best1RM)best1RM=rm}));
  best1RM=Math.round(best1RM);const brz=Math.round(hist.reduce((mx,h)=>Math.max(mx,...h.sets.map(s=>calcBrzycki(s.weight,s.reps))),0));
  return(<div style={S.ov} role="dialog" aria-modal="true" aria-label={L.history} onClick={()=>setHistId(null)}>
    <div style={{...S.dlg,maxWidth:500}} onClick={e=>e.stopPropagation()}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:12,height:12,borderRadius:"50%",background:`var(--${c})`}}/>
          <span style={{fontSize:18,fontWeight:500}}>{nm}</span>
        </div>
        {!isCardioHist&&pr>0&&<span style={{fontSize:13,fontWeight:600,color:"var(--blue)",background:"var(--blueL)",padding:"4px 12px",borderRadius:16}}>{L.pr}: {pr} kg</span>}
      </div>
      {!isCardioHist&&best1RM>0&&<div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        <div style={{background:"var(--purpleL)",border:"1px solid var(--purple)",borderRadius:10,padding:"8px 14px",flex:1,textAlign:"center"}}>
          <div style={{fontSize:18,fontWeight:700,color:"var(--purple)"}}>{best1RM} kg</div>
          <div style={{fontSize:10,color:"var(--t3)"}}>{L.est1RMLabel}</div>
        </div>
        <div style={{background:"var(--tealL)",border:"1px solid var(--teal)",borderRadius:10,padding:"8px 14px",flex:1,textAlign:"center"}}>
          <div style={{fontSize:18,fontWeight:700,color:"var(--teal)"}}>{brz} kg</div>
          <div style={{fontSize:10,color:"var(--t3)"}}>{L.brzycki1RM}</div>
        </div>
      </div>}
      <div style={{maxHeight:400,overflowY:"auto"}}>
        {hist.length===0&&<div style={{color:"var(--t3)",fontSize:13,padding:24,textAlign:"center"}}>{L.noHistory}</div>}
        {hist.map((h,i)=>{const d=pD(h.date);const vol=h.sets.reduce((t,s)=>t+s.weight*s.reps,0);const totalDuration=h.sets.reduce((t,s)=>t+(s.duration||0),0);const session1RM=Math.round(Math.max(...h.sets.map(s=>calc1RM(s.weight,s.reps))));const workoutNote=(data.dayNotes||{})[h.date]||"";
          return(<div key={i} style={{padding:"12px 0",borderBottom:"1px solid var(--brd)"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
              <span style={{fontSize:14,fontWeight:500}}>{d.getDate()} {L.months[d.getMonth()]} {d.getFullYear()}</span>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                {!isCardioHist&&<span style={{fontSize:11,color:"var(--purple)",background:"var(--purpleL)",padding:"2px 6px",borderRadius:8}}>1RM≈{session1RM}</span>}
                <span style={{fontSize:12,color:"var(--t3)"}}>{isCardioHist?`${L.duration} ${fmtDurationValue(totalDuration)}`:`${L.volume} ${vol}kg`}</span>
              </div>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {h.sets.map((s,j)=>(<span key={j} style={{fontSize:12,background:`var(--${c}L)`,color:`var(--${c})`,padding:"3px 10px",borderRadius:12,fontWeight:500}}>{fmtSetValue(histId,s)}
              </span>))}
            </div>
            {workoutNote&&<div style={{marginTop:8,fontSize:12,color:"var(--t2)",lineHeight:1.5,fontStyle:"italic"}}>📝 {lang==="tr"?"Antrenman notu":"Workout note"}: {workoutNote}</div>}
          </div>);
        })}
      </div>
      <div style={{display:"flex",justifyContent:"flex-end",marginTop:16}}>
        <button onClick={()=>setHistId(null)} style={S.sec}>{L.close}</button>
      </div>
    </div>
  </div>);
})()}
{/* SHARE WORKOUT MODAL */}
{showShareModal&&<div style={S.ov} role="dialog" aria-modal="true" aria-label={L.shareWorkout} onClick={()=>setShowShareModal(false)}>
  <div style={{...S.dlg,maxWidth:420}} onClick={e=>e.stopPropagation()}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <h3 style={{fontSize:18,fontWeight:600}}>📤 {L.shareWorkout}</h3>
      <button onClick={()=>setShowShareModal(false)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--t3)",fontSize:20,fontFamily:"inherit"}} aria-label={L.ariaCloseModal}>✕</button>
    </div>
    {selDate&&<div style={{background:"var(--blueL)",borderRadius:10,padding:14,marginBottom:16}}>
      <div style={{fontSize:15,fontWeight:600,color:"var(--blue)",marginBottom:4}}>📅 {selDate.getDate()} {L.months[selDate.getMonth()]} {selDate.getFullYear()}</div>
      <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
        {(data.workouts[fmt(selDate)]||[]).map((w,i)=><span key={i} style={{fontSize:10,padding:"2px 8px",borderRadius:6,background:"var(--bg3)",color:"var(--t1)"}}>{exN(w.exerciseId)}</span>)}
      </div>
    </div>}
    {(()=>{const shareMeasurementMeta=selDate?buildShareMeasurementMeta(fmt(selDate)):null;return <div style={{marginBottom:14,padding:"12px 14px",borderRadius:10,background:"var(--bg3)",border:"1px solid var(--brd)"}}>
      <div style={{fontSize:11,fontWeight:700,color:"var(--t3)",textTransform:"uppercase",letterSpacing:.6,marginBottom:6}}>{lang==="tr"?"Paylaşım tercihleri":"Share preferences"}</div>
      {shareMeasurementMeta?<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {shareMeasurementMeta.values.weight&&<span style={{fontSize:12,padding:"4px 10px",borderRadius:999,background:"var(--greenL)",color:"var(--green)",fontWeight:600}}>⚖️ {lang==="tr"?"Kilo":"Weight"}: {shareMeasurementMeta.values.weight} kg</span>}
        {shareMeasurementMeta.values.height&&<span style={{fontSize:12,padding:"4px 10px",borderRadius:999,background:"var(--tealL)",color:"var(--teal)",fontWeight:600}}>📏 {lang==="tr"?"Boy":"Height"}: {shareMeasurementMeta.values.height} cm</span>}
      </div>:<div style={{fontSize:12,color:"var(--t2)",lineHeight:1.5}}>{lang==="tr"?"Bu paylaşımda boy/kilo bilgisi görünmeyecek. Ayarları profil sayfasından değiştirebilirsin.":"Height/weight will stay hidden in this share. You can change this from your profile settings."}</div>}
    </div>})()}
    <textarea value={shareCaption} onChange={e=>setShareCaption(e.target.value)} placeholder={L.shareCaption} maxLength={200} style={{...S.inp,minHeight:60,resize:"vertical",fontFamily:"inherit"}}/>
    <button onClick={shareWorkout} disabled={sharing} style={{...S.pri,width:"100%",fontSize:15}}>{sharing?"...":`📤 ${L.shareWorkout}`}</button>
  </div>
</div>}

{showUsernameModal&&!isGuest&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",backdropFilter:"blur(4px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:400,animation:"fadeIn .2s ease"}}>
<div style={{background:"var(--bg2)",borderRadius:20,padding:"36px 32px 28px",width:"100%",maxWidth:400,boxShadow:"0 8px 32px rgba(0,0,0,.4)",animation:"scaleIn .3s ease",border:"1px solid var(--brd)"}}>
  <div style={{textAlign:"center",marginBottom:20}}>
    <div style={{fontSize:40,marginBottom:4}}>🏋️</div>
    <h2 style={{fontFamily:"'Archivo Black',sans-serif",fontSize:22,color:"var(--accent)",marginBottom:8}}>{L.chooseUsername}</h2>
    <p style={{fontSize:13,color:"var(--t2)"}}>{L.usernameInvalid}</p>
  </div>
  <input type="text" placeholder={"@"+L.usernamePlaceholder} value={usernameInput} onChange={e=>setUsernameInput(e.target.value.replace(/[^a-zA-Z0-9_]/g,"").slice(0,20))} autoComplete="off" style={{background:"var(--bg3)",border:"1px solid var(--brd)",borderRadius:10,padding:"12px 16px",color:"var(--t1)",fontSize:14,fontFamily:"inherit",width:"100%",marginBottom:12}}/>
  {usernameErr&&<p style={{fontSize:13,color:"var(--red)",textAlign:"center",marginBottom:10,padding:"8px 12px",background:"var(--redL)",borderRadius:8}}>{usernameErr}</p>}
  <button onClick={saveUsername} disabled={usernameBusy} style={{width:"100%",padding:"12px",borderRadius:12,border:"none",background:usernameBusy?"var(--t4)":"var(--accent)",color:"var(--accentT)",fontSize:15,fontWeight:700,cursor:usernameBusy?"not-allowed":"pointer",fontFamily:"inherit",boxShadow:usernameBusy?"none":"0 2px 8px rgba(240,192,64,.3)"}}>{usernameBusy?"...":L.save}</button>
</div>
</div>}

{isGuest&&<div style={{position:"fixed",bottom:0,left:0,right:0,background:"linear-gradient(135deg,#999,#999)",borderTop:"2px solid var(--blue)",padding:"10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px)",display:"flex",alignItems:"center",justifyContent:"center",gap:12,zIndex:100,animation:"fadeIn .3s ease"}}>
  <span style={{fontSize:13,color:"var(--t1)"}}>⚠️ {L.guestWarn}</span>
  <button onClick={showAuth} style={{padding:"5px 16px",borderRadius:16,border:"none",background:"var(--blue)",color:"var(--accentT)",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>{L.guestLogin}</button>
</div>}
</div>);
}

const PAGE_BOTTOM_GAP='max(112px, calc(env(safe-area-inset-bottom, 0px) + 72px))';
const PAGE_BOTTOM_GAP_GUEST='max(156px, calc(env(safe-area-inset-bottom, 0px) + 128px))';
const FAB_BOTTOM_GAP='max(80px, calc(env(safe-area-inset-bottom, 0px) + 72px))';
const FAB_BOTTOM_GAP_GUEST='max(140px, calc(env(safe-area-inset-bottom, 0px) + 128px))';

const S={
  ib:{width:40,height:40,borderRadius:"50%",border:"none",background:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0},
  tBtn:{padding:"6px 20px",borderRadius:4,border:"1px solid var(--brd)",background:"var(--bg)",color:"var(--t1)",fontSize:14,fontWeight:500,cursor:"pointer",fontFamily:"inherit"},
  sel:{padding:"6px 12px",borderRadius:4,border:"1px solid var(--brd)",background:"var(--bg)",color:"var(--t1)",fontSize:13,fontFamily:"inherit",cursor:"pointer"},
  miniA:{width:28,height:28,borderRadius:"50%",border:"none",background:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"var(--t2)",fontFamily:"inherit"},
  pri:{padding:"8px 20px",borderRadius:20,border:"none",background:"var(--blue)",color:"var(--accentT)",fontSize:14,fontWeight:500,cursor:"pointer",fontFamily:"inherit"},
  sec:{padding:"8px 20px",borderRadius:20,border:"1px solid var(--brd)",background:"var(--bg)",color:"var(--t1)",fontSize:14,fontWeight:500,cursor:"pointer",fontFamily:"inherit"},
  inp:{background:"var(--bg2)",border:"1px solid var(--brd)",borderRadius:8,padding:"8px 12px",color:"var(--t1)",fontSize:13,fontFamily:"inherit",width:"100%"},
  th:{fontSize:10,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",letterSpacing:.5},
  fab:{position:"fixed",right:24,width:56,height:56,borderRadius:"50%",border:"none",background:"var(--blue)",cursor:"pointer",boxShadow:"var(--shadow)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50},
  ov:{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:16,animation:"fadeIn .2s ease"},
  dlg:{background:"var(--bg)",borderRadius:16,padding:24,width:"100%",maxWidth:440,maxHeight:"85vh",overflowY:"auto",boxShadow:"var(--shadow)",animation:"scaleIn .2s ease"},
};

function Root(){
  const[user,setUser]=useState(null);
  const[checking,setChecking]=useState(true);
  const[showAuth,setShowAuth]=useState(false);
  const[lang,setLang]=useState(()=>localStorage.getItem(LK)||"tr");
  useEffect(()=>{
    let ready=false;
    const{data:{subscription}}=sb.auth.onAuthStateChange((event,session)=>{
      setUser(session?.user||null);
      if(session?.user)setShowAuth(false);
      if(!ready){ready=true;setChecking(false);}
    });
    sb.auth.getSession().then(({data:{session}})=>{
      if(!ready){ready=true;setUser(session?.user||null);setChecking(false);}
    });
    return()=>subscription.unsubscribe();
  },[]);
  useEffect(()=>{localStorage.setItem(LK,lang)},[lang]);
  if(checking)return(<div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",color:"var(--t1)"}}><div style={{fontSize:18,fontFamily:"'Space Mono',monospace"}}>🏋️ Yükleniyor...</div></div>);
  return <>
    <ErrorBoundary><App key={user?.id||'guest'} user={user} setUser={setUser} lang={lang} setLang={setLang} showAuth={()=>setShowAuth(true)}/></ErrorBoundary>
    {showAuth&&!user&&<AuthScreen onLogin={u=>{setUser(u);setShowAuth(false)}} lang={lang} setLang={setLang} onClose={()=>setShowAuth(false)}/>}
  </>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><Root/></ErrorBoundary>);
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{})})}
</script>

[build]
  publish = "."

# index.html ve index.php -> kök dizine 301 yönlendirme (Accessible index page fix)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index.php"
  to = "/"
  status = 301
  force = true

# Profil sayfası — /profile URL'i profile.html dosyasını sunar
[[redirects]]
  from = "/profile"
  to = "/profile.html"
  status = 200

# Paylaşılan antrenman sayfası — /share URL'i share.html dosyasını sunar
[[redirects]]
  from = "/share"
  to = "/share.html"
  status = 200

# SPA route'ları — React tarafında URL routing var
[[redirects]]
  from = "/social"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/exercises"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/programs"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/feedback"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/data"
  to = "/index.html"
  status = 200

# Var olmayan tüm sayfalar için 404 döndür (catch-all)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"

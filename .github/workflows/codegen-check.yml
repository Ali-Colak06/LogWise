name: Codegen Check

on:
  push:
  pull_request:

jobs:
  codegen:
    name: Generated output drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check generated outputs
        run: node scripts/check-codegen.js

      - name: Habit calendar date and streak tests
        run: node --test scripts/test-habit-utils.js

      - name: Calc and sync safety tests (Faz 1)
        run: node --test scripts/test-calc.js scripts/test-sync.js

      - name: Muscle map, weekly sets and exercise detail tests (Faz 4)
        run: node --test scripts/test-muscles.js

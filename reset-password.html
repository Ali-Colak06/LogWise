<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<meta name="description" content="Reset your Log Wise account password."/>
<title>Log Wise — Şifre Sıfırla</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="styles/base.css"/>
<style>
/* Sayfa-spesifik: reset-password.html kart girişi animasyonu.
 * Ortak reset / :root / :light / ortak @keyframes için styles/base.css'e bak. */
.rp-card{animation:fadeIn .25s ease both}
.rp-spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--brd);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<h1 class="sr-only">Log Wise — Şifre Sıfırla / Reset Password</h1>
<div id="root"></div>
<script>
const SUPABASE_URL = "https://hfmqywyfnqmpvskkzksv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmbXF5d3lmbnFtcHZza2t6a3N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNTExNzIsImV4cCI6MjA5NjgyNzE3Mn0.qRdNSj4No6GI9NLEFG-w9FbtFH4SP3xZGwA2j6yWJHM";
// detectSessionInUrl: recovery linkindeki #access_token=...&type=recovery hash'ini
// otomatik parse edip oturum kurar (implicit flow — cross-device güvenli).
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { detectSessionInUrl: true, flowType: "implicit", persistSession: false, autoRefreshToken: false }
});
const { useState, useEffect, useRef } = React;
const TK = "gym-log-theme", LK = "gym-log-lang";
const MIN_PW = 8;
const APP_URL = "/app";

const STR = {
  tr: {
    title: "Yeni Şifre Belirle",
    subtitle: "Hesabın için yeni bir şifre seç.",
    newPw: "Yeni şifre",
    newPw2: "Yeni şifre (tekrar)",
    show: "Göster",
    hide: "Gizle",
    submit: "Şifreyi Güncelle",
    submitting: "Güncelleniyor…",
    verifying: "Bağlantı doğrulanıyor…",
    okTitle: "Şifren güncellendi",
    okBody: "Yeni şifren kaydedildi. Uygulamaya dönüp yeni şifrenle giriş yapabilirsin.",
    okBtn: "Uygulamaya Git",
    badTitle: "Bağlantı geçersiz veya süresi dolmuş",
    badBody: "Bu şifre sıfırlama bağlantısı artık geçerli değil. Lütfen uygulamadan yeni bir sıfırlama bağlantısı iste.",
    badBtn: "Uygulamaya Git",
    errShort: "Şifre en az " + MIN_PW + " karakter olmalı.",
    errMismatch: "Şifreler eşleşmiyor.",
    errSame: "Yeni şifre eskisiyle aynı olamaz.",
    errNetwork: "Bir hata oluştu. Lütfen tekrar dene.",
    tip: "İpucu: harf, rakam ve sembol karışımı daha güvenlidir."
  },
  en: {
    title: "Set a New Password",
    subtitle: "Choose a new password for your account.",
    newPw: "New password",
    newPw2: "New password (repeat)",
    show: "Show",
    hide: "Hide",
    submit: "Update Password",
    submitting: "Updating…",
    verifying: "Verifying link…",
    okTitle: "Password updated",
    okBody: "Your new password has been saved. Return to the app and sign in with your new password.",
    okBtn: "Go to App",
    badTitle: "Invalid or expired link",
    badBody: "This password reset link is no longer valid. Please request a new reset link from the app.",
    badBtn: "Go to App",
    errShort: "Password must be at least " + MIN_PW + " characters.",
    errMismatch: "Passwords do not match.",
    errSame: "New password can't be the same as the old one.",
    errNetwork: "Something went wrong. Please try again.",
    tip: "Tip: a mix of letters, numbers and symbols is stronger."
  }
};

function IcoSun() {
  return React.createElement("svg", { width: 20, height: 20, viewBox: "0 0 24 24", fill: "var(--t2)" },
    React.createElement("circle", { cx: 12, cy: 12, r: 5 }),
    React.createElement("path", { d: "M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" }));
}
function IcoMoon() {
  return React.createElement("svg", { width: 20, height: 20, viewBox: "0 0 24 24", fill: "var(--t2)" },
    React.createElement("path", { d: "M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z" }));
}

function ResetApp() {
  const [theme, setTheme] = useState(() => localStorage.getItem(TK) || "dark");
  const [lang, setLang] = useState(() => localStorage.getItem(LK) || "tr");
  // status: 'loading' | 'ready' | 'invalid' | 'success'
  const [status, setStatus] = useState("loading");
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [show, setShow] = useState(false);
  const [formErr, setFormErr] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const statusRef = useRef("loading");
  const s = STR[lang] || STR.tr;

  const go = (next) => { statusRef.current = next; setStatus(next); };

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem(TK, theme);
  }, [theme]);
  useEffect(() => { localStorage.setItem(LK, lang); }, [lang]);

  useEffect(() => {
    // Süresi dolmuş / hatalı linkte Supabase, error'ı hash veya query'de döner.
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    const queryParams = new URLSearchParams(window.location.search);
    if (hashParams.get("error") || queryParams.get("error")) {
      go("invalid");
      return;
    }

    const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" || (session && (event === "SIGNED_IN" || event === "INITIAL_SESSION"))) {
        if (statusRef.current === "loading") go("ready");
      }
    });

    // detectSessionInUrl asenkron çalışır; ~1.6sn içinde oturum gelmezse geçersiz say.
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session && statusRef.current === "loading") go("ready");
    });
    const timer = setTimeout(() => {
      sb.auth.getSession().then(({ data: { session } }) => {
        if (statusRef.current !== "loading") return;
        go(session ? "ready" : "invalid");
      });
    }, 1600);

    return () => { subscription.unsubscribe(); clearTimeout(timer); };
  }, []);

  const onSubmit = async () => {
    setFormErr("");
    if (pw.length < MIN_PW) { setFormErr(s.errShort); return; }
    if (pw !== pw2) { setFormErr(s.errMismatch); return; }
    setSubmitting(true);
    const { error } = await sb.auth.updateUser({ password: pw });
    setSubmitting(false);
    if (error) {
      const msg = (error.message || "").toLowerCase();
      if (msg.includes("different from the old") || msg.includes("should be different")) {
        setFormErr(s.errSame);
      } else if (msg.includes("at least") || msg.includes("weak") || msg.includes("characters")) {
        setFormErr(s.errShort);
      } else {
        setFormErr(s.errNetwork);
      }
      return;
    }
    await sb.auth.signOut().catch(() => {});
    go("success");
  };

  // --- styles ---
  const S = {
    wrap: { minHeight: "100vh", display: "flex", flexDirection: "column", background: "var(--bg)", color: "var(--t1)" },
    header: { display: "flex", alignItems: "center", padding: "8px 16px", borderBottom: "1px solid var(--brd)", height: 64, flexShrink: 0, gap: 12, background: "var(--bg)" },
    ib: { width: 40, height: 40, borderRadius: "50%", border: "none", background: "transparent", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 },
    langBtn: { padding: "4px 10px", borderRadius: 6, border: "1px solid var(--brd)", background: "var(--bg)", color: "var(--t1)", fontSize: 12, cursor: "pointer", fontFamily: "inherit" },
    main: { flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: "24px 16px 80px" },
    card: { width: "100%", maxWidth: 400, background: "var(--bg2)", border: "1px solid var(--brd)", borderRadius: 18, padding: 28, boxShadow: "var(--shadow2)" },
    h2: { fontSize: 22, fontWeight: 700, fontFamily: "var(--font-display)", color: "var(--t1)", textAlign: "center", marginBottom: 6 },
    sub: { fontSize: 14, color: "var(--t2)", textAlign: "center", marginBottom: 22, lineHeight: 1.5 },
    label: { fontSize: 12, fontWeight: 600, color: "var(--t2)", display: "block", marginBottom: 6 },
    input: { width: "100%", padding: "12px 14px", borderRadius: 10, border: "1px solid var(--brd)", background: "var(--bg3)", color: "var(--t1)", fontSize: 15, fontFamily: "inherit", boxSizing: "border-box", outline: "none" },
    pri: { width: "100%", padding: "13px 24px", borderRadius: 12, border: "none", background: "var(--accent)", color: "var(--accentT)", fontSize: 15, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", marginTop: 4 },
    err: { fontSize: 13, color: "var(--red)", marginTop: -4, marginBottom: 4 },
    tip: { fontSize: 12, color: "var(--t3)", marginTop: 14, lineHeight: 1.5, textAlign: "center" },
    showBtn: { background: "none", border: "none", color: "var(--accent)", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", padding: 0, marginTop: 6 },
    bigIcon: { fontSize: 52, textAlign: "center", marginBottom: 8 }
  };

  const brand = React.createElement("span", { style: { fontSize: 22, fontWeight: 400, color: "var(--t1)" } },
    "🏋️ ", React.createElement("b", { style: { fontFamily: "var(--font-display)", color: "var(--accent)" } }, "LOG WISE"));

  const header = React.createElement("header", { style: S.header },
    React.createElement("a", { href: "/", style: { textDecoration: "none", display: "flex", alignItems: "center", gap: 8 } }, brand),
    React.createElement("span", { style: { flex: 1 } }),
    React.createElement("button", { onClick: () => setLang(l => l === "tr" ? "en" : "tr"), style: S.langBtn }, lang === "tr" ? "EN" : "TR"),
    React.createElement("button", { onClick: () => setTheme(t => t === "dark" ? "light" : "dark"), style: S.ib }, theme === "dark" ? React.createElement(IcoSun, null) : React.createElement(IcoMoon, null)));

  let body;
  if (status === "loading") {
    body = React.createElement("div", { className: "rp-card", style: { ...S.card, textAlign: "center" } },
      React.createElement("div", { className: "rp-spin", style: { margin: "8px auto 18px" } }),
      React.createElement("p", { style: { fontSize: 14, color: "var(--t2)" } }, s.verifying));
  } else if (status === "invalid") {
    body = React.createElement("div", { className: "rp-card", style: S.card },
      React.createElement("div", { style: S.bigIcon }, "⚠️"),
      React.createElement("h2", { style: S.h2 }, s.badTitle),
      React.createElement("p", { style: S.sub }, s.badBody),
      React.createElement("button", { onClick: () => window.location.href = APP_URL, style: S.pri }, s.badBtn));
  } else if (status === "success") {
    body = React.createElement("div", { className: "rp-card", style: S.card },
      React.createElement("div", { style: S.bigIcon }, "✅"),
      React.createElement("h2", { style: S.h2 }, s.okTitle),
      React.createElement("p", { style: S.sub }, s.okBody),
      React.createElement("button", { onClick: () => window.location.href = APP_URL, style: S.pri }, s.okBtn));
  } else { // ready
    body = React.createElement("div", { className: "rp-card", style: S.card },
      React.createElement("div", { style: S.bigIcon }, "🔒"),
      React.createElement("h2", { style: S.h2 }, s.title),
      React.createElement("p", { style: S.sub }, s.subtitle),
      React.createElement("div", { style: { marginBottom: 14 } },
        React.createElement("label", { style: S.label }, s.newPw),
        React.createElement("input", {
          type: show ? "text" : "password", value: pw, autoFocus: true,
          onChange: e => setPw(e.target.value), placeholder: "••••••••",
          autoComplete: "new-password", style: S.input,
          onKeyDown: e => { if (e.key === "Enter") document.getElementById("rp-pw2") && document.getElementById("rp-pw2").focus(); }
        })),
      React.createElement("div", { style: { marginBottom: 12 } },
        React.createElement("label", { style: S.label }, s.newPw2),
        React.createElement("input", {
          id: "rp-pw2", type: show ? "text" : "password", value: pw2,
          onChange: e => setPw2(e.target.value), placeholder: "••••••••",
          autoComplete: "new-password", style: S.input,
          onKeyDown: e => { if (e.key === "Enter") onSubmit(); }
        }),
        React.createElement("button", { type: "button", onClick: () => setShow(v => !v), style: S.showBtn }, show ? s.hide : s.show)),
      formErr && React.createElement("p", { style: S.err }, formErr),
      React.createElement("button", {
        onClick: onSubmit, disabled: submitting,
        style: { ...S.pri, opacity: submitting ? 0.7 : 1, cursor: submitting ? "default" : "pointer" }
      }, submitting ? s.submitting : s.submit),
      React.createElement("p", { style: S.tip }, s.tip));
  }

  return React.createElement("div", { style: S.wrap }, header,
    React.createElement("main", { style: S.main }, body));
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ResetApp, null));
</script>
</body>
</html>

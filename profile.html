const calcStreak = workouts => {
  let streak = 0;
  const t = new Date();
  t.setHours(0, 0, 0, 0);
  for (let i = 0; i < 365; i++) {
    const d = new Date(t);
    d.setDate(d.getDate() - i);
    const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    if (workouts[k] && workouts[k].some(w => w.sets && w.sets.length > 0)) {
      streak++;
    } else if (i > 0) break;
  }
  return streak;
};

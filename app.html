function NumField({
  value,
  placeholder,
  onValue,
  inputProps,
  style,
  integer
}) {
  const [draft, setDraft] = React.useState(null);
  const shown = draft != null ? draft : value === 0 || value === "" || value == null ? "" : String(value);
  React.useEffect(() => {
    if (draft == null) return;
    const n = parseFloat(String(draft).replace(",", "."));
    if ((isNaN(n) ? 0 : n) !== (Number(value) || 0)) setDraft(value ? String(value) : "");
  }, [value]);
  const ip = inputProps || {};
  return React.createElement("input", {
    type: "text",
    inputMode: integer ? "numeric" : "decimal",
    autoComplete: "off",
    enterKeyHint: "next",
    ...ip,
    value: shown,
    placeholder,
    style,
    onFocus: e => {
      setDraft(shown);
      if (ip.onFocus) ip.onFocus(e);
    },
    onChange: e => {
      const raw = e.target.value.replace(integer ? /[^0-9]/g : /[^0-9.,]/g, "");
      setDraft(raw);
      if (raw.trim() === "") return onValue(0);
      const n = parseFloat(raw.replace(",", "."));
      if (!isNaN(n)) onValue(n);
    },
    onBlur: e => {
      setDraft(null);
      if (ip.onBlur) ip.onBlur(e);
    }
  });
}

(function(){
  if(!('serviceWorker' in navigator)) return;
  var hadController = !!navigator.serviceWorker.controller;
  var announce = function(){
    window.LOGWISE_SW_UPDATE_READY = true;
    try { window.dispatchEvent(new CustomEvent('logwise:sw-update')); } catch(e) {}

      });
    }).catch(function(){});
    navigator.serviceWorker.addEventListener('message',function(e){
      if(e.data && e.data.type==='SW_UPDATED' && hadController) announce();
    });
  });

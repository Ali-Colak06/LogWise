<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>404 - Page Not Found | LOG WISE</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.container{max-width:480px}
.code{font-family:'Space Grotesk','Inter',sans-serif;font-size:120px;color:#f0c040;line-height:1;margin-bottom:16px}
.message{font-size:18px;color:#888;margin-bottom:32px;line-height:1.6}
.home-btn{display:inline-block;padding:14px 32px;background:#f0c040;color:#000;text-decoration:none;border-radius:10px;font-family:'Inter',sans-serif;font-weight:700;font-size:14px;transition:background .2s}
.home-btn:hover{background:#ffd060}
</style>
</head>
<body>
<div class="container">
  <div class="code">404</div>
  <p class="message">This page doesn't exist.<br/>Looks like this workout was skipped.</p>
  <a href="/" class="home-btn">Back to Home</a>
</div>
</body>
</html>
